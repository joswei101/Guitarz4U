# Checks every change: type-check, unit tests and a production build.
# The full browser + database test suite runs on pull requests and on demand.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
        env:
          # Placeholders only — the build does not contact the database.
          NEXT_PUBLIC_SITE_URL: https://example.netlify.app
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder

  full-tests:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start local Supabase (test database only)
        run: npx supabase start -x realtime,studio,imgproxy,edge-runtime,logflare,vector,postgres-meta,supavisor
      - name: Write local test environment
        run: |
          eval "$(npx supabase status -o env | sed 's/^/SB_/')"
          MAILIP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' supabase_inbucket_Guitarz4U)
          {
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
            echo "NEXT_PUBLIC_SUPABASE_URL=$SB_API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$SB_PUBLISHABLE_KEY"
            echo "SUPABASE_SECRET_KEY=$SB_SECRET_KEY"
            echo "SMTP_HOST=$MAILIP"
            echo "SMTP_PORT=1025"
            echo "EMAIL_FROM=Guitarz4U <test@example.test>"
            echo "IP_HASH_SALT=ci"
            echo "CRON_SECRET=ci-secret-ci-secret"
          } > .env.local
      - run: npm run build
      - run: npm run test:all
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }
