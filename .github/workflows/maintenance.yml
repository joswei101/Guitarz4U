# Twice a day: expires overdue reservations, retries failed emails, and keeps
# the free Supabase project active (free projects pause after ~7 days idle).
# Needs repository secrets SITE_URL (e.g. https://guitarz4u.netlify.app) and
# CRON_SECRET (the same value as the CRON_SECRET environment variable in Netlify).
name: Maintenance
on:
  schedule:
    - cron: '17 4,16 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Run maintenance
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::warning::SITE_URL / CRON_SECRET secrets not set — skipping."; exit 0
          fi
          curl -fsS -X POST -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/maintenance"
