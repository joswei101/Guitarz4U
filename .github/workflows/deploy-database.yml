# Applies new database migrations to your Supabase project whenever files in
# supabase/migrations change on the main branch.
# Needs three GitHub repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  — from supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_ID    — the project reference (e.g. abcdefghijklmnop)
#   SUPABASE_DB_PASSWORD   — the database password you chose when creating the project
name: Deploy database migrations
on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**']
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets are set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_ID" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::Supabase secrets are not set, so migrations were not applied. See docs/BEGINNER-GUIDE.md Phase C."
            exit 0
          fi
          echo "READY=1" >> "$GITHUB_ENV"
      - uses: supabase/setup-cli@v1
        if: env.READY == '1'
        with: { version: 2.122.0 }
      - if: env.READY == '1'
        run: supabase link --project-ref "$PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
      - if: env.READY == '1'
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
